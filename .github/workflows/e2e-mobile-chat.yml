name: E2E Mobile Chat

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright ${{ matrix.device }} / ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # LTR and RTL are the two axes required by the PR checklist —
        # each device is exercised in both text directions so we catch
        # horizontal-overflow regressions specific to `dir="rtl"`.
        device: [iphone-12, pixel-5, iphone-se]
        dir: [ltr, rtl]
    env:
      PW_BASE_URL: http://localhost:8080
      # The spec keys its RTL/LTR loop off this env so we can shard the
      # matrix without running both directions in every job.
      PW_CHAT_DIR: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        # iphone-12 and iphone-se projects use the webkit engine, pixel-5
        # uses chromium — both must be installed for the matrix to run.
        run: bunx playwright install --with-deps chromium webkit

      - name: Build (dev mode for faster CI)
        run: bun run build:dev

      - name: Start dev server
        # `vite preview` cannot serve this stack: the Lovable config builds
        # via nitro to `.output/` (cloudflare preset), so the TanStack preview
        # entry `dist/server/server.js` is never produced. The dev server is
        # what Playwright is configured for (localhost:8080) and is the only
        # way to serve the app here.
        run: |
          bun run dev --host 127.0.0.1 --port 8080 &
          echo $! > .preview.pid
          # Wait for the server to accept connections (max ~90s).
          for i in $(seq 1 180); do
            if curl -fsS "$PW_BASE_URL" >/dev/null 2>&1; then
              echo "preview up"; exit 0
            fi
            sleep 0.5
          done
          echo "preview failed to start"; exit 1

      - name: Run mobile chat spec (project=${{ matrix.device }}, dir=${{ matrix.dir }})
        run: bunx playwright test tests/e2e/team-chat-mobile.spec.ts --project=${{ matrix.device }}

      - name: Stop dev server
        if: always()
        run: |
          if [ -f .preview.pid ]; then kill "$(cat .preview.pid)" || true; fi

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-${{ matrix.device }}-${{ matrix.dir }}
          path: test-results/
          if-no-files-found: ignore
